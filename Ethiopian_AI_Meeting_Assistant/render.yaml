services:
  - type: web
    name: ethiopian-meeting-api
    runtime: docker
    plan: starter # free (512 MB RAM) will likely run out of memory - see guide
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # you type it in the Render dashboard
      - key: APP_API_KEY
        generateValue: true
